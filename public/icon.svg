<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mi Álbum Mundial 2026">
  <defs>
    <clipPath id="r">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#bae6fd"/>
      <stop offset="55%"  stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="ball" x1="0.3" y1="0.2" x2="0.8" y2="0.9">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="numShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#r)">
    <!-- Cielo celeste de fondo -->
    <rect width="512" height="512" fill="url(#sky)"/>

    <!-- Líneas tenues estilo cancha (modernas, sutiles) -->
    <g stroke="rgba(255,255,255,0.18)" stroke-width="2" fill="none">
      <circle cx="256" cy="256" r="170"/>
      <line x1="0" y1="256" x2="512" y2="256"/>
    </g>

    <!-- Brillo central -->
    <circle cx="256" cy="240" r="240" fill="url(#glow)"/>

    <!-- Banda blanca diagonal moderna -->
    <path d="M -10,300 L 522,200 L 522,330 L -10,420 Z" fill="url(#band)"/>
    <path d="M -10,300 L 522,200" stroke="rgba(15,23,42,0.08)" stroke-width="2"/>
    <path d="M -10,420 L 522,330" stroke="rgba(15,23,42,0.08)" stroke-width="2"/>

    <!-- Tres estrellitas doradas (3 mundiales argentinos) -->
    <g fill="url(#gold)" stroke="#92400e" stroke-width="1.5">
      <polygon transform="translate(150 100) scale(0.9)" points="0,-18 5.3,-5.6 18,-5.6 7.9,2.1 11.1,14.6 0,7.2 -11.1,14.6 -7.9,2.1 -18,-5.6 -5.3,-5.6"/>
      <polygon transform="translate(256 76) scale(1.1)"   points="0,-18 5.3,-5.6 18,-5.6 7.9,2.1 11.1,14.6 0,7.2 -11.1,14.6 -7.9,2.1 -18,-5.6 -5.3,-5.6"/>
      <polygon transform="translate(362 100) scale(0.9)"  points="0,-18 5.3,-5.6 18,-5.6 7.9,2.1 11.1,14.6 0,7.2 -11.1,14.6 -7.9,2.1 -18,-5.6 -5.3,-5.6"/>
    </g>

    <!-- "26" gigante moderno (navy con outline blanco) -->
    <g transform="translate(256 322)">
      <text text-anchor="middle"
            font-family="'Helvetica Neue','Arial Black',Arial,sans-serif"
            font-weight="900" font-size="270"
            fill="url(#numShade)"
            stroke="#ffffff" stroke-width="14"
            paint-order="stroke fill"
            style="letter-spacing:-12px">26</text>
    </g>

    <!-- Pelota de fútbol chiquita arriba a la derecha -->
    <g transform="translate(396 158)">
      <circle r="40" fill="url(#ball)" stroke="#0f172a" stroke-width="5"/>
      <polygon points="0,-20 19,-6 12,16 -12,16 -19,-6" fill="#0f172a"/>
      <polygon points="-27,-10 -32,3 -25,16 -15,16 -8,3 -15,-10" fill="#0f172a" opacity="0.85"/>
      <polygon points="27,-10 32,3 25,16 15,16 8,3 15,-10" fill="#0f172a" opacity="0.85"/>
    </g>

    <!-- Banner superior "MI ÁLBUM" - pill blanca -->
    <g>
      <rect x="116" y="36" width="280" height="44" rx="22" fill="#ffffff"/>
      <text x="256" y="66" text-anchor="middle"
            font-family="'Helvetica Neue','Trebuchet MS',Arial,sans-serif"
            font-weight="900" font-size="22"
            fill="#0c4a6e" letter-spacing="6">MI ÁLBUM</text>
    </g>

    <!-- Cinta inferior "MUNDIAL" - pill navy -->
    <g>
      <rect x="96" y="438" width="320" height="44" rx="22" fill="#0f172a"/>
      <text x="256" y="468" text-anchor="middle"
            font-family="'Helvetica Neue','Trebuchet MS',Arial,sans-serif"
            font-weight="900" font-size="22"
            fill="#ffffff" letter-spacing="10">MUNDIAL</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mi Álbum Mundial 2026">
  <defs>
    <linearGradient id="skyM" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%"   stop-color="#bae6fd"/>
      <stop offset="55%"  stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="bandM" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="goldM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="numShadeM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="ballM" x1="0.3" y1="0.2" x2="0.8" y2="0.9">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <radialGradient id="glowM" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.55)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Sin clipPath: la máscara la aplica el launcher.
       Safe zone: 51 → 461 (centro 80%). Contenido importante adentro. -->
  <rect width="512" height="512" fill="url(#skyM)"/>

  <!-- Líneas estilo cancha -->
  <g stroke="rgba(255,255,255,0.18)" stroke-width="2" fill="none">
    <circle cx="256" cy="256" r="170"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
  </g>

  <!-- Brillo central -->
  <circle cx="256" cy="256" r="240" fill="url(#glowM)"/>

  <!-- Banda blanca diagonal central (dentro del safe zone) -->
  <path d="M 30,290 L 482,210 L 482,330 L 30,410 Z" fill="url(#bandM)"/>

  <!-- 3 estrellitas doradas centradas en safe zone -->
  <g fill="url(#goldM)" stroke="#92400e" stroke-width="1.5">
    <polygon transform="translate(180 130) scale(0.95)" points="0,-18 5.3,-5.6 18,-5.6 7.9,2.1 11.1,14.6 0,7.2 -11.1,14.6 -7.9,2.1 -18,-5.6 -5.3,-5.6"/>
    <polygon transform="translate(256 110) scale(1.15)"  points="0,-18 5.3,-5.6 18,-5.6 7.9,2.1 11.1,14.6 0,7.2 -11.1,14.6 -7.9,2.1 -18,-5.6 -5.3,-5.6"/>
    <polygon transform="translate(332 130) scale(0.95)"  points="0,-18 5.3,-5.6 18,-5.6 7.9,2.1 11.1,14.6 0,7.2 -11.1,14.6 -7.9,2.1 -18,-5.6 -5.3,-5.6"/>
  </g>

  <!-- Pelota chiquita arriba a la derecha (dentro safe zone) -->
  <g transform="translate(400 200)">
    <circle r="38" fill="url(#ballM)" stroke="#0f172a" stroke-width="5"/>
    <polygon points="0,-19 18,-6 11,15 -11,15 -18,-6" fill="#0f172a"/>
    <polygon points="-25,-10 -30,3 -23,15 -14,15 -8,3 -14,-10" fill="#0f172a" opacity="0.85"/>
    <polygon points="25,-10 30,3 23,15 14,15 8,3 14,-10" fill="#0f172a" opacity="0.85"/>
  </g>

  <!-- "26" gigante centrado -->
  <g transform="translate(256 350)">
    <text text-anchor="middle"
          font-family="'Helvetica Neue','Arial Black',Arial,sans-serif"
          font-weight="900" font-size="230"
          fill="url(#numShadeM)"
          stroke="#ffffff" stroke-width="12"
          paint-order="stroke fill"
          style="letter-spacing:-10px">26</text>
  </g>
</svg>

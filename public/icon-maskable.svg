<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Mi Álbum Mundial 2026">
  <defs>
    <linearGradient id="bvM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="roM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="amM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="emM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#10b981"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="fpM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="glowM" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.35)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="ballM" x1="0.3" y1="0.2" x2="0.8" y2="0.9">
      <stop offset="0%"   stop-color="#ffffff"/>
      <stop offset="60%"  stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
  </defs>

  <!-- Sin clip-path: la máscara la aplica el launcher. -->
  <!-- Cualquier contenido en los 51 px del borde puede recortarse. -->
  <rect width="512" height="512" fill="#0f172a"/>

  <!-- Paneles de fondo (cubren bordes; pueden recortarse sin problema) -->
  <path d="M 0,0 L 320,0 C 250,90 220,170 200,260 C 110,280 50,300 0,320 Z" fill="url(#bvM)"/>
  <path d="M 320,0 L 512,0 L 512,260 C 430,230 360,250 300,290 C 280,200 280,120 320,0 Z" fill="url(#roM)"/>
  <path d="M 0,320 C 70,310 140,320 200,260 C 240,300 280,330 300,400 C 200,420 100,430 0,440 Z" fill="url(#amM)"/>
  <path d="M 512,260 L 512,500 C 420,490 350,470 300,400 C 320,360 360,310 430,290 C 460,280 490,275 512,260 Z" fill="url(#emM)"/>
  <path d="M 0,440 L 0,512 L 512,512 L 512,500 C 420,490 350,470 300,400 C 200,420 100,430 0,440 Z" fill="url(#fpM)"/>

  <!-- Glow central -->
  <circle cx="256" cy="270" r="200" fill="url(#glowM)"/>

  <!-- Contenido CRÍTICO dentro del safe zone (entre 102 y 410, ~80%) -->

  <!-- Pelota -->
  <g transform="translate(256 165)">
    <circle r="48" fill="url(#ballM)" stroke="#0f172a" stroke-width="7"/>
    <polygon points="0,-24 23,-8 14,20 -14,20 -23,-8" fill="#0f172a"/>
    <polygon points="-32,-12 -38,4 -30,20 -18,20 -10,4 -18,-12" fill="#0f172a" opacity="0.85"/>
    <polygon points="32,-12 38,4 30,20 18,20 10,4 18,-12" fill="#0f172a" opacity="0.85"/>
  </g>

  <!-- 26 gigante centrado -->
  <g transform="translate(256 360)">
    <text text-anchor="middle"
          font-family="'Arial Black','Helvetica Neue',Arial,sans-serif"
          font-weight="900" font-size="240" fill="#ffffff"
          stroke="#0f172a" stroke-width="12"
          paint-order="stroke fill"
          style="letter-spacing:-8px">26</text>
  </g>
</svg>

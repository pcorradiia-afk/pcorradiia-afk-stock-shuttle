<title>Ruta 25 — Trivia de viaje</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<style>
  :root {
    --bg: #F6F1E7;
    --surface: #FFFFFF;
    --surface-2: #EFE7D6;
    --ink: #282217;
    --muted: #7A6F5C;
    --line: #DDD2BC;
    --accent: #B26B12;
    --accent-ink: #FFF8EC;
    --good: #2E7D4F;
    --bad: #B3402E;
    --good-bg: #E3F1E8;
    --bad-bg: #F7E4E0;
    --c-dep: #2E8B57;
    --c-his: #C05A2E;
    --c-geo: #3E7CB1;
    --c-mus: #7C5CB8;
    --c-cin: #C24A6E;
    --c-cie: #2B9187;
    --c-rut: #B26B12;
    --c-gen: #8A7B2A;
    --shadow: 0 2px 10px rgba(60, 45, 20, .10);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141B26;
      --surface: #1D2735;
      --surface-2: #253143;
      --ink: #F1EDE3;
      --muted: #9BA4B0;
      --line: #334054;
      --accent: #F2B23E;
      --accent-ink: #221A08;
      --good: #6FCE96;
      --bad: #F09080;
      --good-bg: #1E3A2C;
      --bad-bg: #46251F;
      --c-dep: #4DB37C;
      --c-his: #E08355;
      --c-geo: #6BA5D8;
      --c-mus: #A98BE0;
      --c-cin: #E27795;
      --c-cie: #4FC0B4;
      --c-rut: #F2B23E;
      --c-gen: #C9B84E;
      --shadow: 0 2px 12px rgba(0, 0, 0, .35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #141B26;
    --surface: #1D2735;
    --surface-2: #253143;
    --ink: #F1EDE3;
    --muted: #9BA4B0;
    --line: #334054;
    --accent: #F2B23E;
    --accent-ink: #221A08;
    --good: #6FCE96;
    --bad: #F09080;
    --good-bg: #1E3A2C;
    --bad-bg: #46251F;
    --c-dep: #4DB37C;
    --c-his: #E08355;
    --c-geo: #6BA5D8;
    --c-mus: #A98BE0;
    --c-cin: #E27795;
    --c-cie: #4FC0B4;
    --c-rut: #F2B23E;
    --c-gen: #C9B84E;
    --shadow: 0 2px 12px rgba(0, 0, 0, .35);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    -webkit-tap-highlight-color: transparent;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 0 16px 32px; }

  /* ---- cabecera de ruta ---- */
  header { padding: 14px 0 10px; }
  .route-badge {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    font-weight: 800; font-size: .8rem; letter-spacing: .14em;
    color: var(--muted);
  }
  .route-badge .shield {
    background: var(--accent); color: var(--accent-ink);
    border-radius: 6px; padding: 3px 8px; font-size: .72rem; letter-spacing: .08em;
  }
  h1.title {
    margin: 6px 0 0; text-align: center;
    font-size: 1.9rem; font-weight: 900; letter-spacing: -.01em;
    text-wrap: balance;
  }
  .lane {
    height: 0; border: 0;
    border-top: 4px dashed var(--accent);
    opacity: .8; margin: 14px 0;
  }

  /* ---- progreso del viaje ---- */
  .trip {
    margin: 4px 0 14px;
  }
  .trip .ends {
    display: flex; justify-content: space-between;
    font-size: .7rem; font-weight: 800; letter-spacing: .12em; color: var(--muted);
  }
  .trip .road {
    position: relative; height: 22px; margin-top: 2px;
    background: var(--surface-2); border-radius: 11px; overflow: hidden;
  }
  .trip .road::after {
    content: ""; position: absolute; left: 8px; right: 8px; top: 50%;
    border-top: 2px dashed var(--muted); opacity: .5;
  }
  .trip .car {
    position: absolute; top: 50%; transform: translate(-50%, -54%);
    font-size: 16px; z-index: 1; transition: left .6s ease;
  }
  @media (prefers-reduced-motion: reduce) {
    .trip .car { transition: none; }
    * { animation: none !important; }
  }

  /* ---- marcador ---- */
  .scores { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
  .score-chip {
    flex: 1 1 40%;
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 12px; font-size: .95rem;
  }
  .score-chip.turn { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .score-chip .pts { font-weight: 900; font-variant-numeric: tabular-nums; }
  .score-chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ---- pantallas ---- */
  .screen { display: none; }
  .screen.active { display: block; }
  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 16px; padding: 20px; box-shadow: var(--shadow);
  }
  .eyebrow {
    font-size: .72rem; font-weight: 800; letter-spacing: .16em;
    text-transform: uppercase; color: var(--muted); margin: 0 0 6px;
  }

  button {
    font-family: inherit; cursor: pointer; border: 0;
    -webkit-user-select: none; user-select: none;
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .btn-primary {
    display: block; width: 100%;
    background: var(--accent); color: var(--accent-ink);
    font-size: 1.15rem; font-weight: 900; letter-spacing: .02em;
    padding: 16px; border-radius: 12px;
  }
  .btn-ghost {
    display: block; width: 100%;
    background: transparent; color: var(--muted);
    font-size: .95rem; font-weight: 700; padding: 12px; border-radius: 12px;
  }

  /* ---- setup ---- */
  .setup-players { display: flex; flex-direction: column; gap: 10px; margin: 12px 0 4px; }
  .setup-players input {
    width: 100%; font-family: inherit; font-size: 1.05rem; font-weight: 600;
    padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  }
  .setup-players input:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  .opt-row { display: flex; gap: 8px; margin-top: 10px; }
  .opt-row .opt {
    flex: 1; padding: 10px 6px; border-radius: 10px; font-weight: 800; font-size: .9rem;
    background: var(--surface-2); color: var(--muted); border: 1px solid var(--line);
  }
  .opt-row .opt.sel { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .setup-label { margin: 18px 0 0; }

  /* ---- turno ---- */
  .turn-card { text-align: center; padding: 30px 20px; }
  .turn-name { font-size: 2.1rem; font-weight: 900; margin: 4px 0 2px; text-wrap: balance; }
  .turn-sub { color: var(--muted); font-weight: 600; margin: 0; }
  .cat-banner {
    display: inline-flex; align-items: center; gap: 10px;
    margin: 20px auto 22px; padding: 10px 20px; border-radius: 999px;
    color: #fff; font-weight: 900; font-size: 1.1rem; letter-spacing: .03em;
  }
  .cat-banner .ico { font-size: 1.3rem; }

  /* ---- pregunta ---- */
  .q-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .q-cat {
    display: inline-flex; align-items: center; gap: 6px;
    color: #fff; font-weight: 800; font-size: .78rem; letter-spacing: .08em;
    padding: 5px 12px; border-radius: 999px; text-transform: uppercase;
  }
  .q-turn { font-size: .85rem; font-weight: 700; color: var(--muted); }
  .q-text {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 1.45rem; line-height: 1.35; margin: 6px 0 18px;
    text-wrap: balance;
  }
  .timerbar { height: 6px; border-radius: 3px; background: var(--surface-2); margin-bottom: 14px; overflow: hidden; }
  .timerbar .fill { height: 100%; background: var(--accent); width: 100%; }
  .answers { display: flex; flex-direction: column; gap: 10px; }
  .answers button {
    text-align: left; font-size: 1.12rem; font-weight: 700;
    padding: 15px 16px; border-radius: 12px;
    background: var(--surface-2); color: var(--ink);
    border: 1px solid var(--line);
  }
  .answers button:disabled { cursor: default; }
  .answers button.ok    { background: var(--good-bg); border-color: var(--good); color: var(--ink); }
  .answers button.no    { background: var(--bad-bg);  border-color: var(--bad);  color: var(--ink); }
  .answers button.dim   { opacity: .45; }

  .verdict {
    display: none; text-align: center; margin-top: 16px;
  }
  .verdict.show { display: block; }
  .verdict .big { font-size: 1.3rem; font-weight: 900; margin: 0 0 2px; }
  .verdict .big.ok { color: var(--good); }
  .verdict .big.no { color: var(--bad); }
  .verdict .sub { color: var(--muted); font-weight: 600; margin: 0 0 14px; font-size: .95rem; }

  /* ---- final ---- */
  .podium { display: flex; flex-direction: column; gap: 10px; margin: 16px 0 20px; }
  .podium .row {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px 16px;
  }
  .podium .row.win { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
  .podium .medal { font-size: 1.4rem; width: 34px; text-align: center; }
  .podium .nm { flex: 1; font-weight: 800; font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podium .pts { font-weight: 900; font-size: 1.2rem; font-variant-numeric: tabular-nums; }
  .end-title { text-align: center; font-size: 1.6rem; font-weight: 900; margin: 4px 0 0; text-wrap: balance; }
  .end-sub { text-align: center; color: var(--muted); font-weight: 600; margin: 4px 0 0; }
</style>

<div class="app">
  <header>
    <div class="route-badge">
      <span>TRELEW</span><span class="shield">RN 25</span><span>→</span><span class="shield">RN 237</span><span>NEUQUÉN</span>

  <div class="scores" id="scores" hidden></div>

  <!-- SETUP -->
  <section class="screen active" id="scr-setup">
    <div class="card">
      <p class="eyebrow">¿Quiénes juegan?</p>
      <div class="setup-players" id="setup-players">

        <button class="opt sel" data-v="8">Medio · 8</button>
        <button class="opt" data-v="12">Largo · 12</button>
      </div>

      <p class="eyebrow setup-label">Tiempo para responder</p>
      <div class="opt-row" id="opt-timer">
        <button class="opt sel" data-v="0">Sin tiempo</button>
        <button class="opt" data-v="30">30 seg</button>
        <button class="opt" data-v="15">15 seg</button>
      </div>

      <div style="margin-top:22px">
        <button class="btn-primary" id="btn-start">Arrancar 🚗</button>
      </div>
    </div>
    <p style="text-align:center;color:var(--muted);font-size:.85rem;margin-top:14px">
      Se juega pasándose el teléfono. 10 puntos por acierto,<br>+5 de bonus con racha de 3 o más.
    </p>
  </section>

  <!-- TURNO -->
  <section class="screen" id="scr-turn">
    <div class="card turn-card">
      <p class="eyebrow" id="turn-round"></p>
      <p class="turn-name" id="turn-name"></p>
      <p class="turn-sub">¡Te toca! Agarrá el teléfono.</p>
      <div><span class="cat-banner" id="turn-cat"></span></div>
      <button class="btn-primary" id="btn-show-q">Ver la pregunta</button>
    </div>
  </section>

  <!-- PREGUNTA -->
  <section class="screen" id="scr-q">
    <div class="card">
      <div class="q-head">
        <span class="q-cat" id="q-cat"></span>
        <span class="q-turn" id="q-turn"></span>
      </div>
      <div class="timerbar" id="timerbar" hidden><div class="fill" id="timerfill"></div></div>
      <p class="q-text" id="q-text"></p>
      <div class="answers" id="answers"></div>
      <div class="verdict" id="verdict">
        <p class="big" id="verdict-big"></p>
        <p class="sub" id="verdict-sub"></p>
        <button class="btn-primary" id="btn-next"></button>
      </div>
    </div>
  </section>

  <!-- FINAL -->
  <section class="screen" id="scr-end">
    <div class="card">
      <p class="end-title" id="end-title"></p>
      <p class="end-sub">¡Llegamos a Neuquén! 🏁</p>
      <div class="podium" id="podium"></div>
      <button class="btn-primary" id="btn-rematch">Revancha (mismos jugadores)</button>
      <button class="btn-ghost" id="btn-new">Cambiar jugadores</button>
    </div>
  </section>
</div>

/* ============ ESTADO ============ */
const S = {
  players: [], scores: [], streaks: [],
  totalRounds: 8, timerSecs: 0,
  round: 0, turn: 0,          // ronda actual (0-index), jugador actual
  qIdx: null, catKey: null,   // pregunta en juego
  used: {}, order: {},        // por categoría: índices barajados y puntero
  catCount: {},               // cuántas veces salió cada categoría (para variar)
  timerId: null, answered: false
};

const $ = id => document.getElementById(id);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  $(id).classList.add("active");
  window.scrollTo(0, 0);
}

/* ---- setup ---- */
function bindOptRow(rowId, apply) {
  $(rowId).addEventListener("click", e => {
    const b = e.target.closest(".opt"); if (!b) return;
    $(rowId).querySelectorAll(".opt").forEach(o => o.classList.remove("sel"));
    b.classList.add("sel");
    apply(Number(b.dataset.v));
  });
}
bindOptRow("opt-rounds", v => S.totalRounds = v);
bindOptRow("opt-timer", v => S.timerSecs = v);

$("btn-start").addEventListener("click", () => {
  const players = [];
  [...$("setup-players").querySelectorAll("input")].forEach(inp => {
    const v = inp.value.trim();
    if (v) players.push(v);
  });
  if (players.length < 2) {
    // sin nombres cargados: usar los 4 por defecto
    while (players.length < 4) players.push("Jugador " + (players.length + 1));
  }
  S.players = players;
  startGame();
});

function startGame() {
  S.scores = S.players.map(() => 0);
  S.streaks = S.players.map(() => 0);
  S.round = 0; S.turn = 0;
  S.catCount = {};
  for (const k of Object.keys(BANK)) {
    S.catCount[k] = 0;
    if (!S.order[k] || S.order[k].ptr >= S.order[k].idx.length) {
      S.order[k] = { idx: shuffle([...BANK[k].qs.keys()]), ptr: 0 };
    }
  }
  $("trip").hidden = false;
  $("scores").hidden = false;
  renderScores();
  renderTrip();
  nextTurn();
}

/* ---- marcador y viaje ---- */
function renderScores() {
  $("scores").innerHTML = S.players.map((p, i) =>
    `<div class="score-chip${i === S.turn ? " turn" : ""}">
       <span class="nm">${esc(p)}${S.streaks[i] >= 3 ? " 🔥" : ""}</span>
       <span class="pts">${S.scores[i]}</span>
     </div>`).join("");
}
function renderTrip() {
  const total = S.totalRounds * S.players.length;
  const done = S.round * S.players.length + S.turn;
  const pct = 4 + (done / total) * 92;
  $("trip-car").style.left = pct + "%";
  $("trip-label").textContent = `Ronda ${Math.min(S.round + 1, S.totalRounds)} de ${S.totalRounds}`;
}
function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

/* ---- selección de categoría y pregunta ---- */
function pickCategory() {
  const keys = Object.keys(BANK);
  const min = Math.min(...keys.map(k => S.catCount[k]));
  const candidates = keys.filter(k => S.catCount[k] === min);
  const k = candidates[Math.floor(Math.random() * candidates.length)];
  S.catCount[k]++;
  return k;
}
function drawQuestion(k) {
  const o = S.order[k];
  if (o.ptr >= o.idx.length) { o.idx = shuffle([...BANK[k].qs.keys()]); o.ptr = 0; }
  return o.idx[o.ptr++];
}

/* ---- flujo de turnos ---- */
function nextTurn() {
  if (S.round >= S.totalRounds) { endGame(); return; }
  S.catKey = pickCategory();
  S.qIdx = drawQuestion(S.catKey);
  const cat = BANK[S.catKey];
  $("turn-round").textContent = `Ronda ${S.round + 1} de ${S.totalRounds}`;
  $("turn-name").textContent = S.players[S.turn];
  const banner = $("turn-cat");
  banner.innerHTML = `<span class="ico">${cat.icon}</span>${cat.name}`;
  banner.style.background = `var(${cat.css})`;
  renderScores();
  renderTrip();
  show("scr-turn");
}

$("btn-show-q").addEventListener("click", showQuestion);

function showQuestion() {
  const cat = BANK[S.catKey];
  const q = cat.qs[S.qIdx];
  S.answered = false;
  $("q-cat").innerHTML = `${cat.icon} ${cat.name}`;
  $("q-cat").style.background = `var(${cat.css})`;
  $("q-turn").textContent = S.players[S.turn];
  $("q-text").textContent = q[0];
  $("verdict").classList.remove("show");

  const opts = shuffle([
    { t: q[1], ok: true }, { t: q[2], ok: false }, { t: q[3], ok: false }, { t: q[4], ok: false }
  ]);
  const box = $("answers");
  box.innerHTML = "";
  opts.forEach(o => {
    const b = document.createElement("button");
    b.textContent = o.t;
    b.addEventListener("click", () => answer(b, o.ok));
    box.appendChild(b);
  });

  startTimer();
  show("scr-q");
}

function startTimer() {
  stopTimer();
  if (!S.timerSecs) { $("timerbar").hidden = true; return; }
  $("timerbar").hidden = false;
  const fill = $("timerfill");
  fill.style.transition = "none";
  fill.style.width = "100%";
  // reflow para reiniciar la transición
  void fill.offsetWidth;
  fill.style.transition = `width ${S.timerSecs}s linear`;
  fill.style.width = "0%";
  S.timerId = setTimeout(() => { if (!S.answered) answer(null, false, true); }, S.timerSecs * 1000);
}
function stopTimer() { if (S.timerId) { clearTimeout(S.timerId); S.timerId = null; } }

function answer(btn, ok, timedOut = false) {
  if (S.answered) return;
  S.answered = true;
  stopTimer();
  const fill = $("timerfill");
  fill.style.transition = "none";

  const buttons = [...$("answers").querySelectorAll("button")];
  const correct = BANK[S.catKey].qs[S.qIdx][1];
  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === correct) b.classList.add("ok");
    else if (b === btn) b.classList.add("no");
    else b.classList.add("dim");
  });

  const i = S.turn;
  let gained = 0;
  if (ok) {
    S.streaks[i]++;
    gained = 10 + (S.streaks[i] >= 3 ? 5 : 0);
    S.scores[i] += gained;
  } else {
    S.streaks[i] = 0;
  }

  const big = $("verdict-big"), sub = $("verdict-sub");
  if (ok) {
    big.textContent = `¡Correcto! +${gained}`;
    big.className = "big ok";
    sub.textContent = S.streaks[i] >= 3 ? `🔥 Racha de ${S.streaks[i]} — bonus incluido` : "Bien ahí 👏";
  } else {
    big.textContent = timedOut ? "¡Se acabó el tiempo!" : "Incorrecto";
    big.className = "big no";
    sub.textContent = `La respuesta era: ${correct}`;
  }

  // ¿quién sigue?
  const lastOfRound = S.turn === S.players.length - 1;
  const gameOver = lastOfRound && S.round === S.totalRounds - 1;
  $("btn-next").textContent = gameOver ? "Ver resultado final 🏁"
    : `Pasale el teléfono a ${S.players[(S.turn + 1) % S.players.length]}`;

  renderScores();
  $("verdict").classList.add("show");
}

$("btn-next").addEventListener("click", () => {
  S.turn++;
  if (S.turn >= S.players.length) { S.turn = 0; S.round++; }
  nextTurn();
});

/* ---- final ---- */
function endGame() {
  $("trip-car").style.left = "96%";
  const ranked = S.players.map((p, i) => ({ p, s: S.scores[i] })).sort((a, b) => b.s - a.s);
  const top = ranked[0].s;
  const winners = ranked.filter(r => r.s === top).map(r => r.p);
  $("end-title").textContent = winners.length > 1
    ? `Empate entre ${winners.join(" y ")} 🤝`
    : `¡Ganó ${winners[0]}! 🏆`;
  const medals = ["🥇", "🥈", "🥉", "🚗", "🚗", "🚗"];
  $("podium").innerHTML = ranked.map((r, i) =>
    `<div class="row${r.s === top ? " win" : ""}">
       <span class="medal">${medals[i] || "🚗"}</span>
       <span class="nm">${esc(r.p)}</span>
       <span class="pts">${r.s}</span>
     </div>`).join("");
  renderScores();
  show("scr-end");
}

$("btn-rematch").addEventListener("click", startGame);
$("btn-new").addEventListener("click", () => {
  $("trip").hidden = true;
  $("scores").hidden = true;
  show("scr-setup");
});
</script>

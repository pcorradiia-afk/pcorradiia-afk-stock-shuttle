name: Deploy a GitHub Pages

# Publica la app sola en cada push. No necesitás Vercel ni otra cuenta.
# Antes de que funcione, una sola vez:
#   1) Settings → Pages → Source: "GitHub Actions"
#   2) Settings → Secrets and variables → Actions → New repository secret:
#        VITE_SUPABASE_URL        = tu Project URL de Supabase
#        VITE_SUPABASE_ANON_KEY   = tu anon public key de Supabase
# La anon key es pública por diseño (la seguridad está en las políticas RLS).

on:
  push:
    branches: [main, claude/world-cup-prode-app-eJAeY]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # En Pages la app vive en /<nombre-del-repo>/
          BASE_PATH: /pcorradiia-afk-stock-shuttle/
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: SPA fallback (rutas profundas)
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
